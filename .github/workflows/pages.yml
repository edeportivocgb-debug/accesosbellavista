# Publicación opcional en GitHub Pages (requiere activar Pages: Settings > Pages > Source: GitHub Actions).
# En repos privados Pages depende del plan; úsalo solo si el club lo autoriza.
name: Publicar sitio
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
